name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-django
    env:
      DJANGO_SECRET_KEY: ci-0123456789abcdef0123456789abcdef
      JWT_SIGNING_KEY: ci-fedcba9876543210fedcba9876543210
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend-django/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # ruff solo se usa en CI: no forma parte de las dependencias de la aplicacion ni entra en la imagen.
      - name: Analizar el codigo
        run: |
          pip install ruff==0.17.6
          ruff check . --output-format github

      - name: Verificar migraciones
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Ejecutar tests con cobertura
        run: pytest --cov=core

  # select_for_update no bloquea en SQLite: la concurrencia del motor de reservas se prueba sobre PostgreSQL,
  # en un contenedor descartable, sin frenar la suite general.
  django-concurrencia:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-django
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talibre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-0123456789abcdef0123456789abcdef
      JWT_SIGNING_KEY: ci-fedcba9876543210fedcba9876543210
      DJANGO_DEBUG: "False"
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/talibre?sslmode=disable
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend-django/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas de concurrencia sobre PostgreSQL
        run: pytest core/tests/test_concurrencia.py --ds=config.settings_concurrencia -v -rs

    
  # La suite de Node simula Django, Open-Meteo y MongoDB: no necesita servicios ni secretos, cada test fija su
  # propia configuración y corre en orden aleatorio para detectar dependencias entre tests.
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend-node/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar sintaxis del punto de entrada
        run: node --check server.js

      - name: Analizar el codigo
        run: npm run lint

      - name: Ejecutar tests con cobertura
        run: npm run test:cobertura

  # El frontend no necesita servicios ni secretos para compilar: las URLs de los backends se resuelven en el navegador.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar el código
        run: npm run lint

      - name: Ejecutar tests
        run: npm test

      - name: Compilar
        run: npm run build

  # Construye las tres imagenes, levanta el stack local completo (bases incluidas) con un solo comando desde el clon y
  # lo recorre de punta a punta a traves de nginx, como lo haria un jugador desde el navegador.
  stack:
    needs: [django, node, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: docker-compose.local.yml
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Validar el compose local
        run: docker compose config --quiet

      - name: Construir las imagenes y levantar el stack
        run: docker compose up -d --build --wait --wait-timeout 300

      # La clave de las cuentas de demostracion se toma del propio compose: queda declarada en un solo lugar.
      - name: Prueba de humo de punta a punta
        run: |
          export SEED_PASSWORD_DEMO="$(docker compose config --format json | jq -r '.services.web.environment.SEED_PASSWORD_DEMO')"
          python .github/scripts/prueba_humo.py --url http://localhost:8080

      - name: Registros del stack
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Bajar el stack
        if: always()
        run: docker compose down -v
