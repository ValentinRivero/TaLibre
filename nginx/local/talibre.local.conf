# Sitio de nginx del entorno local (docker-compose.local.yml). Reemplaza a nginx.conf dentro de la misma imagen: igual
# reparto de rutas entre el frontend, backend-django y backend-node, pero solo por HTTP, sin certificados y sin el
# filtro de origen de Cloudflare. No se usa en produccion.
# Reutiliza los fragmentos de produccion. Django no confia en X-Forwarded-Proto con DJANGO_DEBUG=True, y los navegadores
# ignoran Strict-Transport-Security recibido por HTTP: ninguno de los dos cambia el comportamiento local.

limit_conn_zone $binary_remote_addr zone=ws_por_ip:10m;

log_format registro_sin_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                              '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
log_format registro_ws '$remote_addr [$time_local] "WS $uri" $status $body_bytes_sent rt=$request_time';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    access_log /dev/stdout registro_sin_query;
    error_log /dev/stderr crit;

    client_max_body_size 1m;

    include /etc/nginx/snippets/cabeceras-seguridad.inc;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_django http://web:8000;
    set $upstream_node http://node:3000;

    root /usr/share/nginx/html;

    location = /nginx-salud {
        allow 127.0.0.1;
        deny all;
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location ~ /\. {
        return 404;
    }

    location ^~ /api/interno {
        return 404;
    }

    location ~ ^/api/(actividad|reportes-aux|externa|docs-node)(/|$) {
        include /etc/nginx/snippets/proxy.inc;
        proxy_pass $upstream_node;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy.inc;
        proxy_pass $upstream_django;
    }

    location ^~ /graphql {
        include /etc/nginx/snippets/proxy.inc;
        proxy_pass $upstream_django;
    }

    location ^~ /static/ {
        include /etc/nginx/snippets/proxy.inc;
        proxy_pass $upstream_django;
    }

    location /ws/ {
        limit_conn ws_por_ip 20;
        limit_conn_status 429;
        access_log /dev/stdout registro_ws;

        include /etc/nginx/snippets/proxy.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_pass $upstream_django;
    }

    location = /index.html {
        include /etc/nginx/snippets/cabeceras-seguridad.inc;
        include /etc/nginx/snippets/sin-cache.inc;
    }

    location = /sw.js {
        include /etc/nginx/snippets/cabeceras-seguridad.inc;
        include /etc/nginx/snippets/sin-cache.inc;
    }

    location = /manifest.json {
        include /etc/nginx/snippets/cabeceras-seguridad.inc;
        include /etc/nginx/snippets/sin-cache.inc;
    }

    location /assets/ {
        include /etc/nginx/snippets/cabeceras-seguridad.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_min_length 1024;
        gzip_vary on;
        try_files $uri =404;
    }

    location ~ ^/(icons|fonts)/ {
        include /etc/nginx/snippets/cabeceras-seguridad.inc;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml text/plain;
        gzip_min_length 1024;
        gzip_vary on;
        try_files $uri /index.html;
    }
}
